name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t iris-api:v1 .

      - name: Run container
        run: docker run -d -p 5000:5000 --name iris iris-api:v1

      - name: Test API
        run: |
          sleep 15
          curl -f http://localhost:5000/
          curl -f -X POST http://localhost:5000/predict -H "Content-Type: application/json" -d '{"features":[5.1,3.5,1.4,0.2]}'